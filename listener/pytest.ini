[pytest]
# Pytest configuration for THE LISTENER

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v                          # Verbose output
    --tb=short                  # Shorter traceback format
    --strict-markers            # Error on unknown markers
    --disable-warnings          # Cleaner output
    -ra                         # Show summary of all test outcomes
    --cov=src                   # Code coverage for src/ directory
    --cov-report=term-missing   # Show missing lines in coverage report
    --cov-report=html           # Generate HTML coverage report

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database
    requires_eeg: marks tests that require EEG hardware

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/test_log.txt
log_file_level = DEBUG

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
