# WeatherNFT Docker Compose - Development Environment
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: weathernft-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin_password_change_me}
      MONGO_INITDB_DATABASE: weathernft
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - weathernft-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/weathernft --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: weathernft-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change_me} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - weathernft-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Authentication Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-auth
    restart: unless-stopped
    command: node src/backend/auth-service.js
    environment:
      NODE_ENV: development
      AUTH_SERVICE_PORT: 3014
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-CHANGE-IN-PRODUCTION}
      JWT_EXPIRATION: 24h
      LOG_LEVEL: debug
      SERVICE_NAME: auth-service
    ports:
      - "3014:3014"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3014/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NFT Service
  nft-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-nft
    restart: unless-stopped
    command: node src/backend/nft-service.js
    environment:
      NODE_ENV: development
      NFT_SERVICE_PORT: 3009
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-CHANGE-IN-PRODUCTION}
      IPFS_PROVIDER: ${IPFS_PROVIDER:-pinata}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      SD_AI_URL: ${SD_AI_URL:-http://localhost:8000}
      USE_REAL_AI: ${USE_REAL_AI:-false}
      LOG_LEVEL: debug
      SERVICE_NAME: nft-service
    ports:
      - "3009:3009"
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Marketplace Service
  marketplace-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-marketplace
    restart: unless-stopped
    command: node src/backend/marketplace-service.js
    environment:
      NODE_ENV: development
      MARKETPLACE_PORT: 3013
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-CHANGE-IN-PRODUCTION}
      NFT_SERVICE_PORT: 3009
      LOG_LEVEL: debug
      SERVICE_NAME: marketplace-service
    ports:
      - "3013:3013"
    depends_on:
      mongodb:
        condition: service_healthy
      nft-service:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3013/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Guild Service
  guild-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-guild
    restart: unless-stopped
    command: node src/backend/guild-service.js
    environment:
      NODE_ENV: development
      GUILD_SERVICE_PORT: 3010
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-min-32-chars-CHANGE-IN-PRODUCTION}
      LOG_LEVEL: debug
      SERVICE_NAME: guild-service
    ports:
      - "3010:3010"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Analytics Service
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-analytics
    restart: unless-stopped
    command: node src/backend/analytics-service.js
    environment:
      NODE_ENV: development
      ANALYTICS_PORT: 3011
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      LOG_LEVEL: debug
      SERVICE_NAME: analytics-service
    ports:
      - "3011:3011"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Weather API Service
  weather-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-weather
    restart: unless-stopped
    command: node src/backend/weather-api-service.js
    environment:
      NODE_ENV: development
      WEATHER_API_PORT: 3012
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      LOG_LEVEL: debug
      SERVICE_NAME: weather-service
    ports:
      - "3012:3012"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Service
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-websocket
    restart: unless-stopped
    command: node src/backend/websocket-service.js
    environment:
      NODE_ENV: development
      WEBSOCKET_PORT: 8080
      MONGODB_URI: mongodb://weathernft_app:${MONGO_APP_PASSWORD:-app_password}@mongodb:27017/weathernft?authSource=weathernft
      LOG_LEVEL: debug
      SERVICE_NAME: websocket-service
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weathernft-frontend
    restart: unless-stopped
    command: node src/frontend/simple-frontend-server.js
    environment:
      NODE_ENV: development
      PORT: 8081
      AUTH_SERVICE_PORT: 3014
      NFT_SERVICE_PORT: 3009
      MARKETPLACE_PORT: 3013
      GUILD_SERVICE_PORT: 3010
      ANALYTICS_PORT: 3011
      WEATHER_API_PORT: 3012
      WEBSOCKET_PORT: 8080
    ports:
      - "8081:8081"
    depends_on:
      - auth-service
      - nft-service
      - marketplace-service
      - guild-service
      - analytics-service
      - weather-service
      - websocket-service
    networks:
      - weathernft-network
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs

# Networks
networks:
  weathernft-network:
    driver: bridge

# Volumes
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
